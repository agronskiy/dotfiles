[ids]

# Match every keyboard-like device, so the mappings work on any machine
# regardless of built-in/external keyboard. Exclusions below.
*

# Yubikey: emulates a keyboard to type OTPs; must not go through tab-layer
-1050:0407

[main]
tab = overload(tab-layer, tab)

[tab-layer]
g = home
k = up
h = left
l = right
j = down
; = end

# Fixes taken from https://www.reddit.com/r/linuxquestions/comments/1lrbn15/help_wanted_for_keyd/
[control]
# Fixes so ctrl+tab works with tab overload
tab = C-tab

[alt]
# Fixes so alt+tab works with tab overload
tab = A-tab

[shift]
# Fixes shift tab same as above
tab = S-tab
